name: secrets
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --redact -v
      - name: redaction patterns (results, cards, docs)
        run: |
          files=$(git ls-files results cards docs prompts '*.md' | grep -v -e '^results/LICENSE$' -e '\.png$' -e '\.mp4$' -e '\.webm$' || true)
          [ -z "$files" ] || python3 tools/redact.py --check $files
